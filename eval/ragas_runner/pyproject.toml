[project]
name = "ms-ragas-runner"
version = "0.1.0"
description = "Isolated RAGAS runner for MarketSignal evaluation samples (no dependency on the backend package)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "ragas==0.4.3",
    "langchain-community==0.3.31",
    "rapidfuzz==3.14.6",
    "rouge-score==0.1.2",
    "sacrebleu==2.6.0",
    "anthropic==1.9.0",
    "fastembed==0.8.1",
]

[project.scripts]
ragas-eval = "ms_ragas_runner.cli:main"

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.9", "mypy==2.3.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ms_ragas_runner"]

[tool.uv]
exclude-newer = "2026-09-30T00:00:00Z"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "S", "RUF", "PT", "N"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
packages = ["ms_ragas_runner"]

[[tool.mypy.overrides]]
module = ["ragas.*", "fastembed.*", "langchain_community.*"]
ignore_missing_imports = true
