# MarketSignal synthetic seed corpus - world model (single source of truth).
# Fictional data created for the MarketSignal demo.
# Every company, person, product and number below is invented. Documents in
# seed_data/generated/ are rendered deterministically from this file by
# seed_data/generator/generate.py (no LLM calls at generation time).

meta:
  disclaimer: "Fictional data created for the MarketSignal demo."
  hypothesis: "Gen Z customers will pay a premium for personalized products"
  seed: 20260101
  fixed_timestamp: "2026-01-01T00:00:00Z"
  fiscal_year_note: "Northstar fiscal years follow the calendar year. FY26 = Jan-Dec 2026; FY26 figures are a latest estimate (LE) because the year is not closed. The Q3 Strategy Review was held in July 2026 and reviews Q2 results."
  gen_z_definition: "Gen Z = customers aged 18 to 27 (strict finance definition). The brand team's loyalty definition uses ages 16 to 29, which explains the 21% vs 19.4% revenue-share contradiction."

workspaces:
  - code: NORTHSTAR
    name: "Northstar Athletics - Gen Z Growth Engagement"
    client: "Northstar Athletics"
    description: "Fictional athletic apparel and footwear company looking for its next growth opportunity among Gen Z consumers."
  - code: SOUTHPEAK
    name: "Southpeak Outdoor - Brand Refresh"
    client: "Southpeak Outdoor"
    description: "Fictional outdoor gear company; decoy workspace with near-duplicate themes and unique canary facts for isolation testing."

