# ---------------------------------------------------------------------------
# Planted contradictions (pairs of facts that disagree).
# ---------------------------------------------------------------------------
contradictions:
  - {id: C1, a: NS-041, b: NS-051, topic: "Stated willingness to pay a 15% premium (38%) vs revealed uptake of the 15% premium tier in the pilot (9%)."}
  - {id: C2, a: NS-081, b: NS-050, topic: "Early week-six pilot read of 27% repeat vs final 90-day repeat of 18% (below 24% control)."}
  - {id: C3, a: NS-001, b: NS-127, topic: "Gen Z share of FY25 revenue: 21% (brand team, loyalty definition 16-29) vs 19.4% (finance, strict 18-27)."}
  - {id: C4, a: NS-021, b: NS-110, topic: "Kinetic Lab return rate: 6% claimed by the company vs about 15% from analyst channel checks including remakes."}
  - {id: C5, a: NS-072, b: NS-071, topic: "Focus group: personalization excites as a status signal, yet ranks behind fit guarantee, delivery and materials honesty when spending points."}

