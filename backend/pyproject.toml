[project]
name = "marketsignal"
version = "0.1.0"
description = "Evidence-grounded growth-strategy research platform: hybrid retrieval, governed MCP tools, bounded agent, evaluation harness."
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.140.13",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.13",
  "pydantic-settings>=2.5",
  "sqlalchemy[asyncio]>=2.1",
  "psycopg[binary,pool]>=3.3",
  "alembic>=1.20",
  "pgvector>=0.5",
  "redis>=5.0",
  "structlog>=24.1",
  "prometheus-client>=0.20",
  "mcp==2.3.0",
  "pyjwt[crypto]>=2.10",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "mypy>=1.11",
  "hypothesis>=6.100",
  "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marketsignal"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "S", "RUF", "PT", "N"]
ignore = ["S101"]  # asserts are fine; tests and invariants use them deliberately

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S608"]
"migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
packages = ["marketsignal"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pgvector.*", "prometheus_client.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
  "integration: requires PostgreSQL (+pgvector) and Redis from docker compose",
]
addopts = "-ra --strict-markers"
