name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1

jobs:
  safety:
    name: repository safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Reference-material, size and private-content guard
        run: scripts/check_repo_safety.sh --tracked
      - name: Secret scan (gitleaks, full history)
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks git --redact --no-banner --config .gitleaks.toml --log-opts="--all" .

  backend:
    name: backend (lint, types, unit + integration)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-bootstrap
          POSTGRES_DB: marketsignal
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d marketsignal"
          --health-interval 3s --health-timeout 3s --health-retries 20
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      MS_ENV: test
      MS_DATABASE_URL: postgresql+psycopg://ms_app:ci-only-app@localhost:5432/marketsignal
      MS_MIGRATIONS_DATABASE_URL: postgresql+psycopg://ms_owner:ci-only-owner@localhost:5432/marketsignal
      MS_REDIS_URL: redis://localhost:6379/0
      MS_REQUIRE_INTEGRATION: "1"
      MS_TEST_SUPERUSER_DATABASE_URL: postgresql+psycopg://postgres:ci-only-bootstrap@localhost:5432/marketsignal
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install Python 3.13 + dependencies
        run: |
          uv python install 3.13
          uv sync --locked
      - name: Create roles (same script compose runs at initdb)
        env:
          PGHOST: localhost
          PGPASSWORD: ci-only-bootstrap
          POSTGRES_USER: postgres
          POSTGRES_DB: marketsignal
          MS_OWNER_PASSWORD: ci-only-owner
          MS_APP_PASSWORD: ci-only-app
        run: bash db/init/01_roles.sh
      - name: Migrate (as schema owner)
        run: uv run alembic upgrade head
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Tests (unit + integration, as ms_app)
        run: uv run pytest

  frontend:
    name: frontend (lint, types, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  images:
    name: container build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
